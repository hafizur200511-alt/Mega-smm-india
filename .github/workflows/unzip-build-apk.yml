name: Unzip and Build Mega SMM India APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      # 1. Checkout repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Extract ZIP
      - name: Extract Android Project ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE=$(find . -maxdepth 1 -type f -name "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP file found in repository root."
            exit 1
          fi

          mkdir -p extracted
          unzip -oq "$ZIP_FILE" -d extracted

          echo "ZIP extracted successfully."
          find extracted -maxdepth 3 -type f | head -100

      # 3. Locate Android project
      - name: Locate Android Project
        shell: bash
        run: |
          set -euo pipefail

          SETTINGS_FILE=$(find extracted -type f \
            \( -name "settings.gradle.kts" -o -name "settings.gradle" \) \
            -not -path "*/.gradle/*" | head -n 1 || true)

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: Gradle settings file not found."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"

          if [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ] && \
             [ ! -f "$PROJECT_DIR/app/build.gradle" ]; then
            echo "ERROR: Android app module not found."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Android project: $PROJECT_DIR"

      # 4. Install Java
      - name: Set Up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # 5. Setup Android SDK
      - name: Set Up Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 12266719

      # 6. Install Android SDK packages
      - name: Install Android SDK Packages
        shell: bash
        run: |
          set -euo pipefail

          sdkmanager --sdk_root="$ANDROID_HOME" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

          yes | sdkmanager --sdk_root="$ANDROID_HOME" --licenses || true

      # 7. Detect Gradle version
      - name: Detect Gradle Configuration
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail

          echo "Checking Android Gradle Plugin configuration..."

          grep -R -n -E \
            'com\.android\.application|com\.android\.tools\.build:gradle|distributionUrl' \
            --include="*.gradle" \
            --include="*.gradle.kts" \
            --include="gradle-wrapper.properties" \
            . || true

      # 8. Build APK
      - name: Build Debug APK
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug --no-daemon
          elif [ -f "./gradle/wrapper/gradle-wrapper.properties" ]; then
            echo "Wrapper properties exist, but gradlew script is missing."
            echo "Cannot safely generate a wrapper without knowing the project's required Gradle version."
            exit 1
          else
            echo "No Gradle wrapper found."
            echo "Using Gradle 8.13 as a fallback."
            gradle --version
            gradle assembleDebug --no-daemon
          fi

      # 9. Verify APK
      - name: Verify APK
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail

          APK=$(find app/build/outputs/apk/debug \
            -type f -name "*.apk" 2>/dev/null | head -n 1 || true)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo "APK generated successfully: $APK"
          ls -lh "$APK"

      # 10. Upload APK
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mega-SMM-India-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
